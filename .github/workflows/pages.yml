# Publishes ONLY the site/ folder to GitHub Pages. Nothing else in the repo is served.
# tools/validate.py runs first: if the data fails the check (a bad phone edit, say), nothing is deployed
# and the live site stays on the last good version.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/validate.py', 'tools/write_version.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the data (tools/validate.py)
        run: python3 tools/validate.py
      - uses: actions/configure-pages@v5
      - name: Stamp the deployed commit (site/version.json, read by the phone's saved copy)
        run: python3 tools/write_version.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
