<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- The edit sign-in lives in this browser, so only this site's own scripts run, and the page talks only to
     itself and the GitHub API. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>CardSelector</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --text: #14171c;
    --muted: #5a6270;
    --line: #e1e5eb;
    --accent: #0a58c2;
    --bonus: #0a6b39;
    --warn-bg: #fff0c2;
    --warn-text: #5c4300;
    --ok-bg: #d8f3e2;
    --ok-text: #0b5a31;
    --ok: #0b5a31;
    --warn-dot: #c98a00;
    --neutral-bg: #e8ebef;
    --neutral-text: #3d4552;
    --card-sel-bg: #14284b;
    --card-sel-text: #ffffff;
    --cuis: #6b2fa3;
    --cuis-bg: #f3ecfa;
    --bonus-bg: #e6f4ec;
    --f-fresh: #0b6b3a;
    --f-aging: #7a5700;
    --f-soon: #b04400;
    --soon: #b04400;
    --f-old: #b3261e;
    --f-unknown: #5a6270;
    --tint: #eaf6ef;
    --cuis-line: #c7b0e0;
    --new-bg: #e3eefc;
    --new-text: #0a58c2;
    --box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 6px rgba(16, 24, 40, .04);
    /* Home screen surfaces (search, Quick picks, Card bonuses, shortcuts): white on the light gray page, a hairline
       edge and a soft shadow; in dark mode the surface color and a line do the lifting. */
    --tile-line: #e6e9ee;
    --tile-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .06);
    --soon-bg: #fdeee3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1014;
      --surface: #1c2129;
      --text: #eef0f3;
      --muted: #a2a9b5;
      --line: #2c333d;
      --accent: #7ab2ff;
      --bonus: #5fd493;
      --warn-bg: #4a3a0a;
      --warn-text: #ffe29a;
      --ok-bg: #12402a;
      --ok-text: #a6ebc3;
      --ok: #a6ebc3;
      --warn-dot: #f2b632;
      --neutral-bg: #2a2f38;
      --neutral-text: #c8cdd6;
      --card-sel-bg: #eef0f3;
      --card-sel-text: #0f1115;
      --cuis: #cfa8f5;
      --cuis-bg: #2a2137;
      --bonus-bg: #12301f;
      --f-fresh: #5fd493;
      --f-aging: #f2c94c;
      --f-soon: #ff9e57;
      --soon: #ff9e57;
      --f-old: #ff8a80;
      --f-unknown: #a2a9b5;
      --tint: #13281c;
      --cuis-line: #6d5a86;
      --new-bg: #1a2d4d;
      --new-text: #7ab2ff;
      --box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      --tile-line: #2c333d;
      --tile-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      --soon-bg: #3a2616;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

  .searchbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0 8px;
    transition: box-shadow 150ms;
  }
  /* Scrolled: a hairline and a soft shadow under the sticky search box. */
  .searchbar.scrolled { box-shadow: 0 1px 0 #e1e5eb, 0 6px 12px -8px rgba(16, 24, 40, .25); }
  .sr-only, .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  /* Issuer dots: one color per bank, the same in light and dark. */
  .idot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; vertical-align: 1px; margin-right: 6px; }
  .i-chase { background: #2f6fd6; }
  .i-usb { background: #d4502f; }
  .i-boa { background: #c0325a; }
  .i-citi { background: #13998f; }
  .i-cap1 { background: #e0891f; }
  .cat.cardbtn .idot { width: 7px; height: 7px; margin-right: 5px; }
  #q {
    width: 100%; height: 48px;
    padding: 0 18px;
    font: inherit; font-size: 17px;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--tile-line); border-radius: 12px;
    box-shadow: var(--tile-shadow);
    -webkit-appearance: none; appearance: none;
  }
  #q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 0 5px rgba(10, 88, 194, .12); }
  #q::placeholder { color: var(--muted); }
  .count { margin: 12px 2px 0; min-height: 1.4em; color: var(--muted); font-size: 13px; font-weight: 600; }
  .offline { margin: 2px 2px 0; color: var(--muted); font-size: 13px; }

  /* "Use: <card> <rate>": the card to pay with, under the search box whenever a search or category is active. */
  .use { margin: 0 0 4px; padding: 12px 14px; background: var(--tint); border: 1.5px solid var(--bonus); border-radius: 12px; }
  .use[hidden] { display: none; }
  .usehead { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .usehead strong { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; color: var(--bonus); }
  .usehead .useextra { font-size: 14px; font-weight: 400; color: var(--muted); }
  /* The dot of the card a headline total names first. */
  .usehead .idot { width: 9px; height: 9px; margin-right: 6px; vertical-align: 1px; }
  /* "Likely": a category rate decides the total (the full sentence is in .sr for screen readers). */
  .usehead .likely {
    display: inline-block; margin-left: 6px; padding: 0 6px; line-height: 17px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px; vertical-align: 2px;
  }
  .usenote { margin-top: 3px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .useat {
    margin-bottom: 2px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--bonus); overflow-wrap: anywhere;
  }
  .usehead + .usehead { margin-top: 4px; }
  .usehead.usem { font-size: 16px; }
  .usehead .usemname { font-weight: 700; }
  .usesub { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  /* Where you're paying: Any | In store | Online (one setting with the Filters row). */
  .chansel { display: flex; margin: 0 0 10px; padding: 2px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
  .chansel button {
    flex: 1; min-height: 44px; padding: 0 6px; font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: transparent; border: 0; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chansel button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .chansel button:focus-visible, .usechan:focus-visible, .rates > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* A channel's answer that picks that channel when tapped (the rows under Any, the better other channel). */
  .usechan {
    display: block; width: 100%; min-height: 44px; margin: 0; padding: 8px 10px; font: inherit; text-align: left; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .usehead.usechan { font-size: 15px; }
  .usehead.usechan + .usehead.usechan { margin-top: 6px; }
  .usealt { margin-top: 8px; font-size: 14px; font-weight: 600; }
  .usechan .usechn { font-weight: 700; }
  .usealt strong { font-weight: 750; color: var(--bonus); }
  .usealt .useextra { font-weight: 400; color: var(--muted); }
  .usealt .idot { width: 8px; height: 8px; margin-right: 5px; }
  /* "+1 pt": what a better line adds over Ready now. */
  .usegain {
    display: inline-block; margin-left: 6px; padding: 0 6px; line-height: 18px; font-size: 12px; font-weight: 700;
    color: var(--bonus); background: var(--surface); border: 1px solid var(--bonus); border-radius: 9px; vertical-align: 1px;
  }
  /* Citi Custom Cash: conditional, never the answer; a separate alternative when it would beat it. */
  .usecond.strong { margin-top: 6px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .usecond.strong strong { font-weight: 750; color: var(--text); }
  .usecond.strong .useextra { font-size: 13.5px; font-weight: 400; color: var(--muted); }
  .usecond .idot { width: 8px; height: 8px; margin-right: 5px; opacity: .7; }
  /* Card rates here: the bonus rows, folded at the bottom of the answer card. */
  details.rates { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
  .rates > summary {
    display: flex; align-items: center; min-height: 44px; gap: 4px; list-style: none; cursor: pointer;
    font-size: 13.5px; color: var(--muted); -webkit-tap-highlight-color: transparent;
  }
  .rates > summary::-webkit-details-marker { display: none; }
  .rates > summary::marker { content: ""; }
  .rates > summary::after {
    content: ""; width: 7px; height: 7px; margin: -3px 4px 0 auto; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .rates[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  .rates .ratesh { font-weight: 700; color: var(--text); flex: none; }
  .rates .ratesl { min-width: 0; overflow-wrap: anywhere; }
  .rates .bonusrows { margin-top: 4px; }
  .rates .bonusrow { background: var(--surface); }
  .rates .bonusrow.hint { background: var(--neutral-bg); }
  .ratesnc { margin-top: 8px; padding: 8px 14px; background: var(--neutral-bg); border-radius: 12px; font-size: 13px; }
  .ratesnch { font-weight: 700; color: var(--neutral-text); }

  /* Filters: one summary button on phones, the full panel on wide screens. On phones the Filters button and the
     open filters join into one panel (square corners where they meet). */
  .ftoggle {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin: 0; padding: 0 14px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--text); text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ftoggle .fsumm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ftoggle .fsumm .on { color: var(--accent); }
  .ftoggle::after {
    content: ""; width: 7px; height: 7px; margin: -3px 4px 0 0; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .ftoggle[aria-expanded="true"]::after { margin-top: 3px; transform: rotate(-135deg); }
  .ftoggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* Open: the filters hang under the button; the panel's top border is the one line between them. */
  .ftoggle[aria-expanded="true"] { border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .filters { margin-top: 12px; }
  @media (max-width: 699px) {
    .filters:not(.open) { display: none; }
    .filters.open {
      margin: 0; padding: 12px 14px 14px; background: var(--surface);
      border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px;
    }
  }
  @media (min-width: 700px) {
    .ftoggle { display: none; }
  }

  /* Sort: one native select (opens the phone's own picker), always visible above the filters. */
  .selwrap { position: relative; }
  .selwrap::after {
    content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }
  #sort {
    display: block; width: 100%; min-height: 44px; padding: 0 40px 0 14px;
    font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  #sort:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sorthelp { margin: 6px 2px 0; font-size: 12.5px; color: var(--muted); }

  /* Filter groups (sort, card, category, and cuisine under Dining): a small label over each row of buttons. */
  .filter + .filter { margin-top: 12px; }
  .flabel { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  /* Buttons wrap onto as many lines as needed, never scroll sideways. */
  .cats, .cards, .cuisines { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 4px; }
  .cat {
    min-height: 32px; padding: 0 10px;
    font: inherit; font-size: 13px; font-weight: 600; line-height: 1.2;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* Card buttons: rounded rectangles, bolder text, navy (light) / light (dark) when selected. */
  .cat.cardbtn { border-radius: 6px; font-weight: 600; }
  .cat.cardbtn[aria-pressed="true"] { background: var(--card-sel-bg); border-color: var(--card-sel-bg); color: var(--card-sel-text); }
  /* Cuisine row (only under Dining): a tinted panel with square-cornered plum chips, so it reads as a sub-filter. */
  .filter.cuis { margin-top: 8px; padding: 8px 10px 10px; background: var(--cuis-bg); border-radius: 10px; }
  .filter.cuis[hidden] { display: none; }
  .filter.cuis .flabel { color: var(--cuis); }
  .cat.cuisbtn { border-radius: 6px; border: 1px solid var(--cuis-line); color: var(--cuis); background: transparent; font-size: 13px; }
  .cat.cuisbtn .n, .cat .n { font-weight: 400; opacity: .7; }
  .cat.cuisbtn[aria-pressed="true"] { background: var(--cuis); border-color: var(--cuis); color: var(--bg); }

  ul.results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
  /* A merchant container: the header (name, cuisine or category, offer count) expands every row in it. */
  li.mc {
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--box-shadow);
    overflow: hidden;
  }
  .mchead {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 9px 14px 8px;
    font: inherit; color: var(--text); text-align: left; background: none; border: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mchead:active { background: var(--neutral-bg); }
  .mchead:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 12px; }
  .mctext { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .mcname { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .mcsub { font-size: 13px; color: var(--muted); }
  .mchead .chev { color: var(--muted); }
  .chev { flex: none; display: inline-block; transition: transform .15s; }
  .mchead[aria-expanded="true"] .chev { transform: rotate(180deg); }
  ul.mcrows { list-style: none; margin: 0; padding: 0; }
  /* One offer row: card, tags, breakdown and terms on the left; the total, minimum and status on the right.
     The row itself is not a tap target (the header is). */
  li.offer { border-top: 1px solid var(--line); }
  .orow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 14px 9px; }
  .oleft { flex: 1 1 auto; min-width: 0; }
  .ocard { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; }
  .ocard .mcard { font-weight: 600; color: var(--text); }
  .obreak { margin-top: 1px; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .oterms { margin-top: 1px; font-size: 13px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
  .oterms > span { white-space: nowrap; }
  .oterms > span.long { white-space: normal; }
  .oterms .nochan { font-style: italic; }
  /* Ends within 7 days: a clock and "Ends in N days". */
  .oterms .soon { font-weight: 650; color: var(--soon); white-space: nowrap; }
  .oterms .soon .bico { width: 12px; height: 12px; margin-right: 3px; vertical-align: -1px; }
  .oright { flex: none; max-width: 44%; display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 1px; }
  .obig { font-size: 20px; font-weight: 750; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--bonus); }
  .omin { font-size: 12.5px; color: var(--muted); }
  .ostat { margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .ostat.done { display: inline-flex; align-items: center; gap: 3px; color: var(--ok); }
  .ostat.needs { padding: 1px 7px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-text); }
  .bico { width: 11px; height: 11px; flex: none; }
  /* "New": the card's latest read added this offer (light blue fill, accent text; 5.6:1 light, 6.3:1 dark). */
  .newtag {
    display: inline-block; padding: 1px 7px; border-radius: 6px; line-height: 1.3;
    font-size: 13px; font-weight: 650; color: var(--new-text); background: var(--new-bg);
  }
  /* An approved location's own place ("Newport Beach"), on its row inside the group's container. */
  .loctag {
    display: inline-block; padding: 1px 7px; border-radius: 6px; line-height: 1.3;
    font-size: 13px; font-weight: 600; color: var(--neutral-text); background: var(--neutral-bg);
  }
  /* What changed, Gone list: the other cards still offering this merchant. */
  .stillon { margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .stillon .socard { font-weight: 600; color: var(--text); }
  .stillon .idot { width: 7px; height: 7px; margin-right: 4px; }
  /* An open row's links: Google search for its own name, and the card's offers page; 44px tall targets. */
  .olinks { display: flex; flex-wrap: wrap; gap: 0 18px; margin: -6px 0 6px; }
  a.glink, a.cardlink {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  a.glink:focus-visible, a.cardlink:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a.glink .ext { width: 14px; height: 14px; margin: 0; }
  .cardico {
    width: 22px; height: 22px; padding: 3px; box-sizing: border-box;
    border: 1.5px solid currentColor; border-radius: 5px; background: var(--neutral-bg);
  }
  .gone a.glink, .gone a.glink .ext, .gone a.cardlink { color: var(--muted); } /* the icon's own .ext color would keep it blue */
  .ext { display: inline-block; width: .7em; height: .7em; margin-left: .3em; color: var(--accent); vertical-align: baseline; }

  .details { padding: 4px 14px 12px; font-size: 14px; }
  .details[hidden] { display: none; }
  .details dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0; align-items: baseline; }
  .details dl + dl { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  dt { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd.fine { font-size: 14px; line-height: 1.4; }
  dd ul { margin: 0; padding-left: 18px; }
  .dnone { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
  /* Cuisine evidence, folded away under the purchase details. */
  details.cuisdet { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
  details.cuisdet > summary { min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: var(--cuis); cursor: pointer; }
  details.cuisdet > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  details.cuisdet p { margin: 2px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  /* Import notes on how the issuer's screen was read: quiet, at the bottom. */
  details.srcdet > summary { color: var(--muted); }
  details.srcdet ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

  .more {
    display: block; width: 100%; min-height: 44px; margin: 10px 0 0; padding: 0 16px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--accent);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .more:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .more[hidden] { display: none; }

  .hint, .empty { margin: 28px 4px; color: var(--muted); }
  .empty strong { color: var(--text); }

  details.expired { margin-top: 28px; }
  details.expired > summary {
    min-height: 44px; display: flex; align-items: center;
    padding: 0 4px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  details.expired > ul.results { margin-top: 4px; }
  details.expired .note { margin: 8px 4px 0; color: var(--muted); font-size: 14px; }
  /* Offers that dropped off: same rows, grayed out (a container of only such rows is dashed). */
  li.mc.gone { background: transparent; border-style: dashed; box-shadow: none; }
  li.mc.gone .mcname, .gone .ocard .mcard, .gone .obreak { color: var(--muted); }
  .gone .obig { font-weight: 650; color: var(--muted); }

  .ostat.dropped { font-weight: 600; }
  /* The Used button sits close under Activation. */
  .filter#used-filter { margin-top: 10px; }
  /* In store / Online and Activation while the Used list is on: they don't apply. */
  .filter.off .cats, .filter.off .flabel, .filter.off .sorthelp { opacity: .4; }
  .filter.off .cat { cursor: default; }

  /* What changed: a panel under the search box (back arrow, card, reads compared, New / Gone). On phones the Filters
     button joins its bottom. Quick picks and Card bonuses are hidden while the mode is on. */
  .wcpanel { margin: 8px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .wcpanel[hidden] { display: none; }
  .wctop { display: flex; align-items: center; gap: 2px; padding: 4px 14px 0 4px; }
  .wcback {
    display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px;
    padding: 0; color: var(--text); background: none; border: 0; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wcback svg { width: 22px; height: 22px; }
  .wcback:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .wctitle { min-width: 0; }
  .wcname { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .wcsub { font-size: 13px; color: var(--muted); }
  .wctabs { display: flex; gap: 8px; padding: 8px 14px 12px; }
  .wctabs .cat.wctab { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 15px; }
  h3.wcgroup { margin: 18px 2px 0; font-size: 13px; font-weight: 700; letter-spacing: .03em; color: var(--muted); }
  h3.wcgroup .n { font-weight: 600; }
  @media (max-width: 699px) {
    .wcpanel { border-radius: 12px 12px 0 0; }
    .wrap.wcon .ftoggle { margin-top: 0; border-top: 0; border-radius: 0 0 12px 12px; }
    .wrap.wcon .ftoggle[aria-expanded="true"] { border-bottom: 0; border-radius: 0; }
  }

  /* Quick picks (home screen): six compact topic tiles in two columns, then the full-width Everyday default.
     Quieter than the answer card and offer containers: plain surface tiles, one green rate each. */
  .qp { margin: 6px 0 0; }
  .qp[hidden] { display: none; }
  /* Section labels: compact and dark, the qualifier muted ("Quick picks · no offer needed"). */
  .qphead { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
  .qph { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--text); }
  .qph .qphq { font-weight: 400; color: var(--muted); }
  .qpw .likely, .qpa .likely {
    align-self: center; padding: 0 5px; line-height: 16px; font-size: 11.5px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px;
  }
  .qpgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* A tile: an elevated surface; the topic and the card glyph on top, the rate big and green, the card, then muted notes. */
  .qpt {
    min-width: 0; padding: 10px 12px 11px; background: var(--surface); border: 1px solid var(--tile-line); border-radius: 14px;
    box-shadow: var(--tile-shadow); font-size: 13px; line-height: 1.3; overflow-wrap: anywhere;
  }
  .qpn { font-size: 14.5px; font-weight: 700; color: var(--text); overflow-wrap: normal; }
  .qpw { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; margin-top: 1px; }
  .qpr { font-size: 27px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; color: var(--bonus); font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }
  .qpc { font-size: 14px; font-weight: 700; line-height: 1.3; overflow-wrap: normal; }
  .qpc .idot { width: 7px; height: 7px; margin-right: 5px; }
  .qpm { font-size: 12.5px; color: var(--muted); }
  .qpx { margin-top: 3px; font-size: 12.5px; font-weight: 600; }
  .qpx .usegain { margin-left: 0; line-height: 16px; font-size: 11.5px; }
  .qpkeep { white-space: nowrap; }
  .qpa .likely { display: inline-block; margin-left: 6px; vertical-align: 1px; }
  /* Citi Custom Cash: a full alternative when it would beat the ready rate, else one short muted line. */
  .qpcond { font-weight: 400; color: var(--muted); }
  .qpcond.strong { font-weight: 600; color: var(--text); }
  .qpnote { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  /* The Everyday default tile, full width: glyph, title and caveat, the rate on the right. Information only. */
  .qpe { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0 12px; margin-top: 10px; padding: 11px 14px 12px; }
  .qpe > .cglyph { grid-column: 1; grid-row: 1 / span 2; }
  .qpe > .qpw { grid-column: 2; grid-row: 1; margin: 0; }
  .qpe .qpn, .qpe .qpc { font-size: 15px; font-weight: 700; }
  .qpe > .qpr { grid-column: 3; grid-row: 1 / span 2; }
  .qpe > .qpnote { grid-column: 2; grid-row: 2; margin-top: 1px; }
  /* The card glyph: a small card in the issuer's color with a light chip stripe (home screen only; dots elsewhere). */
  .cglyph {
    position: relative; display: inline-block; flex: none; width: 28px; height: 19px; border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
  }
  .cglyph::before { content: ""; position: absolute; left: 4px; top: 5px; width: 8px; height: 5px; border-radius: 1.5px; background: rgba(255, 255, 255, .85); }
  .cglyph.i-none { background: #8a93a3; }

  /* Card bonuses (home screen, under Quick picks): one elevated list, a compact row per live bonus entry. */
  .cb { margin: 18px 0 0; }
  .cb[hidden] { display: none; }
  .cbhead { justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
  .cbpend { font-size: 13px; }
  .cbpend.bwarn { padding: 0 6px; }
  .cbnone { color: var(--muted); }
  .cblist {
    list-style: none; margin: 0; padding: 0; background: var(--surface);
    border: 1px solid var(--tile-line); border-radius: 14px; box-shadow: var(--tile-shadow); overflow: hidden;
  }
  /* A row: the card glyph in a left column, the card name, its one-line summary (muted), the state line, a chevron. */
  .cbrow { position: relative; padding: 10px 30px 11px 54px; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .cbrow + .cbrow::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; border-top: 1px solid var(--line); }
  .cbcard { display: block; font-size: 15px; font-weight: 700; }

  .cbsumm { display: block; margin-top: 1px; font-size: 13.5px; color: var(--muted); }
  .cb .brate { font-weight: 600; color: inherit; }
  .cbst { margin-top: 3px; font-size: 13px; line-height: 1.5; }
  .cbinfo { color: var(--muted); }
  .cbst .bok { font-weight: 650; }
  .cbst .bwarn { display: inline; padding: 1px 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* A slim button after the warning (it wraps under it when the line is full). */
  .cbst .edfill { margin: 2px 0 0 2px; padding: 0 8px; font-size: 13px; vertical-align: middle; }

  /* Quick pick tiles and Card bonuses rows open their detail pages: the tile is one button (a grid: topic and glyph,
     rate and chevron, then the rest); a row's button (card and summary) stretches over the whole row, with a right
     chevron. A row's inline Mark activated sits above it: it saves and never opens the row. */
  .qpt.go { position: relative; padding: 0; }
  .qpgo {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; align-content: start; gap: 0 8px; width: 100%; height: 100%; margin: 0;
    padding: 10px 12px 11px; font: inherit; color: inherit; text-align: left;
    background: none; border: 0; border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .qpgo > span { display: block; grid-column: 1 / -1; }
  .qpgo > .qpn { grid-column: 1; grid-row: 1; align-self: center; }
  .qpgo > .cglyph { display: inline-block; grid-column: 2; grid-row: 1; align-self: center; }
  .qpgo > .qpw { display: flex; grid-column: 1; grid-row: 2; }
  .qpgo > .gochev { grid-column: 2; grid-row: 2; position: static; display: block; align-self: center; justify-self: end; margin-right: 6px; }
  .qpgo:active { background: var(--neutral-bg); }
  .qpgo:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  /* Narrow phones (under 360px): the topic gets the whole top line (no word is split), the glyph sits beside the rate,
     the chevron beside the card. */
  @media (max-width: 359px) {
    .qpgo { padding: 10px 10px 11px; }
    .qpgo > .qpn { grid-column: 1 / -1; }
    .qpgo > .qpw { grid-row: 2; }
    .qpgo > .cglyph { grid-row: 2; }
    .qpgo > .qpc { grid-column: 1; grid-row: 3; }
    .qpgo > .gochev { grid-row: 3; }
    .qpgo .qpr { font-size: 24px; }
    .qpgo > .cglyph { width: 22px; height: 15px; border-radius: 3.5px; }
    .qpgo > .cglyph::before { left: 3px; top: 4px; width: 6px; height: 4px; }
  }
  .gochev {
    position: absolute; width: 8px; height: 8px;
    border-right: 1.75px solid var(--muted); border-bottom: 1.75px solid var(--muted); transform: rotate(-45deg);
  }
  .cbgo {
    display: block; width: 100%; margin: 0; padding: 0; font: inherit; color: inherit; text-align: left;
    background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .cbgo .cbl1 { display: block; }
  .cbgo::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  .cbgo:active::after { background: rgba(127, 127, 127, .12); }
  .cbgo:focus-visible { outline: none; }
  .cbgo:focus-visible::after { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 14px; }
  .cbgo .gochev { right: 14px; top: 50%; margin-top: -4px; }
  .cbst .edfill { position: relative; z-index: 1; }

  /* New / Ending shortcuts (home screen, between Card bonuses and Offer freshness): two compact actions side by side,
     stacked when the screen is too narrow for both to read well. */
  .sc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0 0; }
  .sc[hidden] { display: none; }
  .scgo {
    display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 60px; margin: 0; padding: 10px 12px;
    font: inherit; color: var(--text); text-align: left; background: var(--surface); border: 1px solid var(--tile-line);
    border-radius: 14px; box-shadow: var(--tile-shadow); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .scgo:active { background: var(--neutral-bg); }
  .scgo:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .scico { display: inline-flex; flex: none; }
  .scico svg { width: 20px; height: 20px; }
  .scnewico { color: var(--new-text); }
  .scendico { color: var(--soon); }
  .sctext { display: block; min-width: 0; }
  .scn { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .scsub { display: block; font-size: 13px; line-height: 1.3; color: var(--muted); }
  /* Offer freshness on the home screen (moved up from the footer), then the quieter utilities. */
  .homefresh { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  .homefresh[hidden], .homeutil[hidden] { display: none; }
  .wrap.home .count:empty { min-height: 0; margin: 0; }
  .wrap.home .hint.homehint { margin: 14px 4px 4px; font-size: 13px; line-height: 1.4; }
  /* Recently unavailable, Filters (closed) and Edit mode (closed): plain muted rows, each with its expand chevron. */
  .wrap.home details.expired { margin-top: 0; }
  .wrap.home details.expired > summary, .homeutil .ftoggle[aria-expanded="false"], .wrap.home .editmode:not([open]) > summary {
    min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .wrap.home details.expired > summary { list-style: none; -webkit-tap-highlight-color: transparent; }
  .wrap.home details.expired > summary::-webkit-details-marker { display: none; }
  .wrap.home details.expired > summary::after {
    content: ""; width: 7px; height: 7px; margin: -3px 4px 0 auto; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .wrap.home details.expired[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  .wrap.home details.expired > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 10px; }
  .homeutil .ftoggle[aria-expanded="false"] { margin-top: 0; background: transparent; border-color: transparent; }
  .homeutil .ftoggle[aria-expanded="false"] .fsumm .on { color: var(--muted); }
  .wrap.home footer { margin-top: 0; }
  .wrap.home .editmode:not([open]) { background: transparent; border-color: transparent; box-shadow: none; }

  /* Ending soon: the one removable chip under the search box (the shortcut's scope). */
  .endbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .endbar[hidden] { display: none; }
  .endchip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; margin: 0; padding: 0 10px 0 14px;
    font: inherit; font-size: 14px; font-weight: 650; color: var(--bg); background: var(--accent); border: 0; border-radius: 999px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .endchip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .endx { font-size: 19px; font-weight: 500; line-height: 1; }

  /* Quick Pick and Card Bonus details (a mode of the page): a sticky back arrow and title, then quiet sections.
     Everything else on the page hides while it is on (the footer keeps Edit mode). */
  .wrap.dton > :not(#dt):not(footer):not(.offline) { display: none !important; }
  .wrap.dton #fresh { display: none; }
  .dtpanel[hidden] { display: none; }
  .dttop {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 2px;
    margin: 0 -16px; padding: 8px 16px 6px 12px; background: var(--bg); transition: box-shadow 150ms;
  }
  .dttop.scrolled { box-shadow: 0 1px 0 var(--line), 0 6px 12px -8px rgba(16, 24, 40, .25); }
  .dth { margin: 0; font-size: 18px; font-weight: 750; line-height: 1.25; overflow-wrap: anywhere; }
  .dth .idot { vertical-align: 2px; }
  .dtpanel .brate { font-weight: 700; color: var(--bonus); }
  .dtbody { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  .dtsec { margin-top: 10px; padding: 10px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .dtsec > h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--muted); }
  .dtsec.dtcat { background: var(--neutral-bg); border-color: transparent; }
  .dtsec.dtcat > h3 { color: var(--neutral-text); }
  .dtcath { font-weight: 700; }
  .dtans { margin-top: 2px; padding: 0; background: none; border: 0; font-size: 14px; }
  .dtans > span { display: block; }
  .dtans > .qpw { display: flex; }
  .dtlist { margin: 0; padding-left: 18px; }
  .dtlist li + li { margin-top: 3px; }
  .dtp { margin: 0; }
  .dtp + .dtp { margin-top: 4px; }
  .dtmuted { color: var(--muted); }
  /* Ranked cards: the rate, then the card and its status; each row opens that card's bonus details. */
  .dtrank { list-style: none; margin: 0 -6px; padding: 0; }
  .dtrank li + li { border-top: 1px solid var(--line); }
  .dtrow {
    position: relative; display: grid; grid-template-columns: 4.1em minmax(0, 1fr); align-items: baseline; gap: 0 6px;
    width: 100%; min-height: 44px; margin: 0; padding: 7px 24px 7px 6px; font: inherit; font-size: 14px; color: var(--text);
    text-align: left; background: none; border: 0; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  div.dtrow { cursor: default; }
  .dtrow:active { background: var(--neutral-bg); }
  div.dtrow:active { background: none; }
  .dtrow:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .dtrow .gochev { right: 8px; top: 50%; margin-top: -4px; }
  .dtrate { white-space: nowrap; font-size: 17px; font-weight: 750; color: var(--bonus); font-variant-numeric: tabular-nums; }
  .dtcard { font-weight: 650; }
  .dtwhy { display: block; grid-column: 2; font-size: 12.5px; color: var(--muted); }
  .dtst { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 650; line-height: 18px; white-space: nowrap; }
  .dtst.st-act { background: var(--ok-bg); color: var(--ok-text); }
  .dtst.st-on { background: var(--neutral-bg); color: var(--neutral-text); }
  .dtst.st-cond, .dtst.st-below { background: transparent; color: var(--muted); border: 1px solid var(--line); line-height: 16px; }
  .dtst.st-pend { background: var(--warn-bg); color: var(--warn-text); }
  .dtrow.muted .dtrate, .dtrow.muted .dtcard { color: var(--muted); }
  .dtrow.muted .idot { opacity: .5; }
  /* Links to a related Card Bonus detail ("Change CardSelector focus", "Choice: online shopping"). */
  .dtlinks { display: grid; gap: 6px; margin-top: 10px; }
  .dtlink {
    position: relative; display: block; width: 100%; min-height: 44px; margin: 0; padding: 10px 28px 10px 14px; font: inherit; font-size: 15px;
    font-weight: 600; color: var(--accent); text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .dtlink:active { background: var(--neutral-bg); }
  .dtlink:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dtlink .gochev { right: 14px; top: 50%; margin-top: -4px; border-color: var(--accent); }
  /* Card Bonus details: status lines, rates, the eligible categories or choices. */
  .dtline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .dtline + .dtline { margin-top: 6px; }
  .dtline .edfill, .dtline .edlink { margin-top: 0; margin-bottom: 0; }
  .dtrates { list-style: none; margin: 0; padding: 0; }
  .dtrates li + li { margin-top: 3px; }
  .dtrates .brate { font-weight: 700; color: var(--bonus); }
  .dtopts { list-style: none; margin: 6px 0 0; padding: 0; }
  .dtopts li { padding: 6px 0; }
  .dtopts li + li { border-top: 1px solid var(--line); }
  .dtoname { font-weight: 650; }
  .dttag {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 650; line-height: 18px;
    color: var(--new-text); background: var(--new-bg); white-space: nowrap;
  }
  .dtalso { display: block; font-size: 12.5px; color: var(--muted); }
  .dtsec .bfocus { margin-top: 8px; }
  details.dtmore { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  details.dtmore > summary {
    min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    list-style: none; -webkit-tap-highlight-color: transparent;
  }
  details.dtmore > summary::-webkit-details-marker { display: none; }
  details.dtmore > summary::after {
    content: ""; width: 7px; height: 7px; margin: -3px 4px 0 auto; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  details.dtmore[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  details.dtmore > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 12px; }
  .dtmorebody { padding: 0 14px 12px; }
  .dtmorebody h4 { margin: 10px 0 2px; font-size: 13px; font-weight: 700; }
  .dtmorebody h4:first-child { margin-top: 0; }
  .dtmorebody p { margin: 2px 0 0; color: var(--muted); }
  .dtmorebody a { color: var(--accent); }
  .bwarn {
    display: inline-block; padding: 1px 8px; border-radius: 6px;
    background: var(--warn-bg); color: var(--warn-text); font-weight: 600;
  }
  .bok { color: var(--ok-text); font-weight: 600; }
  /* Bonus rows above the offers: a tinted box, not a tappable offer. */
  .bonusrows { display: grid; gap: 8px; margin: 8px 0 0; }
  .bonusrow { padding: 10px 14px; background: var(--bonus-bg); border-radius: 12px; font-size: 14px; }
  .bonusrow .bhead { font-weight: 700; color: var(--bonus); }
  .bonusrow.hint { margin: 0; background: var(--neutral-bg); color: var(--neutral-text); }
  .bonusrow .bnote { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  details.bonusrow .bnote { margin-top: 6px; }
  /* A row that opens: the summary fills the row (the row's padding moves onto it), a 44px tap target. */
  details.bonusrow { padding: 0; min-width: 0; }
  .bonusrow > summary {
    display: block; min-height: 44px; padding: 10px 14px; box-sizing: border-box;
    list-style: none; cursor: pointer; border-radius: 12px; -webkit-tap-highlight-color: transparent;
  }
  .bonusrow > summary::-webkit-details-marker { display: none; }
  .bonusrow > summary::marker { content: ""; }
  .bonusrow > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bonusrow .bl1 { display: flex; align-items: center; gap: 6px; }
  .bonusrow .btag { width: 12px; height: 12px; flex: none; color: var(--bonus); }
  .bonusrow .bl1 .bhead { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere; }
  .bonusrow .bchev {
    width: 7px; height: 7px; margin: -3px 4px 0 6px; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .bonusrow[open] .bchev { margin-top: 3px; transform: rotate(-135deg); }
  /* Closed: one line of whole entries, then "+N". */
  .bonusrow .bline { display: flex; align-items: center; gap: 12px; margin-top: 2px; line-height: 20px; white-space: nowrap; overflow: hidden; font-size: 14px; }
  .bonusrow[open] .bline { display: none; }
  .bonusrow .bent { display: block; flex: none; }
  .bonusrow .bout { display: none; }
  .bonusrow .bplus { flex: none; font-size: 13px; font-weight: 600; color: var(--muted); }
  .bonusrow .bcn { font-weight: 600; }
  /* Not activated: a "⚠" before the name, in the Card bonuses warning color. */
  .bonusrow .bwarnmk { margin-right: 3px; font-size: 15px; font-weight: 600; color: var(--warn-text); }
  /* Closed: the row's caveats on one line, cut with "…"; open, they show in full below. */
  .bonusrow .bcav {
    display: block; margin-top: 2px; font-size: 12.5px; line-height: 18px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bonusrow[open] .bcav { display: none; }
  .bonusrow .brate { font-weight: 700; color: var(--bonus); }
  /* Open: one entry per line, then the notes. */
  .bonusrow .bbody { padding: 0 14px 10px; }
  .bonusrow .blist { display: grid; gap: 4px; margin: 0; padding: 6px 0 0; list-style: none; font-size: 14px; }
  /* Cards below the everyday rate, and rows where every bonus card is below it: kept for reference, muted. */
  .bonusrow .bbelow, .bonusrow .bbelow .brate { color: var(--muted); }
  .bonusrow .bbelow .idot { opacity: .5; }
  .bonusrow.muted { background: var(--surface); color: var(--muted); }
  .bonusrow.muted .bhead, .bonusrow.muted .btag, .bonusrow.muted .brate { color: var(--muted); }
  /* "For “starbucks”" / "For Travel": which bonus rows come from the search and which from the button. */
  .bgroup { margin: 4px 2px -2px; font-size: 13px; font-weight: 700; letter-spacing: .03em; color: var(--muted); }

  footer { margin: 32px 0 0; color: var(--muted); font-size: 14px; }
  footer[hidden] { display: none; }

  /* Offer freshness (footer): collapsed one-liner, tap to list each card's last full read. */
  details.fresh { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--box-shadow); }
  details.fresh > summary {
    min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    padding: 6px 14px; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; list-style: none;
    -webkit-tap-highlight-color: transparent;
  }
  details.fresh > summary::-webkit-details-marker { display: none; }
  details.fresh > summary::after {
    content: ""; width: 7px; height: 7px; margin: -3px 4px 0 auto; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  details.fresh[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  details.fresh > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 12px; }
  /* Freshness summary: title, age and dot on one line at phone width (the age part smaller and muted). */
  #fsum { flex-wrap: nowrap; gap: 6px; }
  #fsum .fsumtext { min-width: 0; }
  #fsum .ftitle { font-size: 14px; font-weight: 600; }
  #fsum .fsumage { font-size: 13px; font-weight: 500; color: var(--muted); }
  /* The chip is only its dot; the band word is in a visually hidden span for screen readers. */
  .fchip { display: inline-flex; align-items: center; flex: none; }
  .fdot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .fbody { padding: 0 14px 12px; }
  .fnote { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
  ul.flist { list-style: none; margin: 0; padding: 0; }
  li.frow { border-top: 1px solid var(--line); }
  .fhead {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 12px;
    width: 100%; min-height: 44px; padding: 8px 0; margin: 0;
    font: inherit; font-size: 14px; color: var(--text); text-align: left;
    background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .fhead:focus-visible { outline: 3px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  .fname { font-weight: 650; overflow-wrap: anywhere; }
  .fstatus { font-size: 13px; font-weight: 650; text-align: right; }
  .fage { grid-column: 1; color: var(--muted); font-size: 13px; }
  .fage .fnew { font-weight: 650; color: var(--bonus); }
  /* A row with changes opens What changed: a right chevron in its own column. */
  .fhead.fgo { grid-template-columns: minmax(0, 1fr) auto 16px; }
  .fhead .fchev {
    grid-column: 3; grid-row: 1 / span 2; align-self: center; justify-self: end; width: 7px; height: 7px; margin-right: 3px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg);
  }
  .fdetail { margin: 0; padding: 0 0 10px; font-size: 14px; color: var(--text); overflow-wrap: anywhere; }
  .fdetail[hidden] { display: none; }
  .s-fresh { color: var(--f-fresh); }
  .s-aging { color: var(--f-aging); }
  .s-soon { color: var(--f-soon); }
  .s-old { color: var(--f-old); }
  .s-unknown { color: var(--f-unknown); }

  /* Phone edits: quiet controls next to the status they change, the save bar at the bottom, the Edit mode panel. */
  .edbtn {
    min-height: 44px; padding: 0 14px; font: inherit; font-size: 16px; font-weight: 650;
    color: var(--accent); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .edbtn:disabled, .edfill:disabled, .edsm:disabled, .edlink:disabled { opacity: .45; cursor: default; }
  .edbtn:focus-visible, .edfill:focus-visible, .edsm:focus-visible, .edlink:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* Small filled amber button on a "Not activated" line. */
  .edfill {
    min-height: 32px; padding: 0 10px; font: inherit; font-size: 13.5px; font-weight: 700;
    color: #2b1d00; background: #f2b632; border: 0; border-radius: 7px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* Small outline button (Mark used, Used on <card>, Save focus). */
  .edsm {
    min-height: 34px; padding: 0 10px; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* Muted grey text link ("Undo" after "Activated"); padded to a usable tap target. */
  .edlink {
    padding: 8px 6px; margin: -8px -2px; font: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 2px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .edrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 10px; font-size: 14px; }
  .edrow + .edrow { margin-top: -4px; }
  .bfocus { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; font-size: 14px; }
  .bfocus select {
    min-height: 34px; max-width: 100%; padding: 0 6px; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  .bfocus .edsm[hidden] { display: none; }
  /* Save bar: one compact line with the status and inline actions; after Live it shrinks to a small pill. */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 3px solid var(--accent); box-shadow: 0 -3px 12px rgba(0, 0, 0, .14);
    transition: opacity .3s;
  }
  .savebar[hidden] { display: none; }
  .savebar.ok { border-top-color: var(--bonus); }
  .savebar.warn { border-top-color: var(--f-soon); }
  .savebar.err { border-top-color: var(--f-old); }
  .savein { display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
  .savemsg { flex: 0 1 auto; min-width: 0; margin: 0; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .savemsg a { color: var(--accent); }
  /* Undo / Retry follow the message on the same line; the close (×) sits at the far right. */
  .savebtns { display: flex; flex: 1 0 auto; align-items: center; gap: 4px; }
  .savebtns:empty { display: none; }
  .savebtns .edlink { margin: -8px 0; padding: 8px 8px; font-size: 14.5px; font-weight: 600; color: var(--accent); }
  .savebtns .savesep { color: var(--muted); margin: 0 -6px 0 -6px; }
  .savebar.live .savesep { font-size: 13px; }
  li.offer.actctl .ostat:not(.dropped) { display: none; }
  .savebtns .xbtn { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 20px; line-height: 1; padding: 6px 10px; }
  .savebar.live {
    left: auto; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100% - 24px);
    padding: 4px 4px 4px 12px; border: 1px solid var(--line); border-left: 3px solid var(--bonus); border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  .savebar.live .savemsg { font-size: 13px; color: var(--muted); }
  .savebar.live .savebtns .edlink { font-size: 13px; }
  .wrap.barpad { padding-bottom: 90px; }
  .editmode { margin-top: 8px; }
  .editmode summary .edon, .editmode summary .edoff { margin-left: 8px; font-size: 14px; font-weight: 700; }
  .edon { color: var(--bonus); }
  .edoff { color: var(--muted); }
  .edwarn { color: var(--f-old); font-weight: 650; }
  .fnote a { color: var(--accent); }
  .signin { display: grid; gap: 6px; }
  .signin label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .signin input {
    width: 100%; height: 44px; padding: 0 12px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .signin input:focus { outline: none; border-color: var(--accent); }
  /* Sign in: the one filled button. */
  .signin .edbtn {
    justify-self: start; margin-top: 4px; min-height: 44px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    #q { box-shadow: none; }
    .searchbar.scrolled { box-shadow: 0 1px 0 #2a3039, 0 6px 12px -6px rgba(0, 0, 0, .6); }
    #q:focus { box-shadow: 0 0 0 1px var(--accent), 0 0 0 5px rgba(122, 178, 255, .18); }
    .signin .edbtn { color: #0f1115; }
  }
  .ferr { margin: 0; min-height: 1.2em; font-size: 15px; color: var(--f-old); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <div class="searchbar">
    <label for="q" class="sr-only">Search merchants</label>
    <input id="q" type="search" placeholder="Search a merchant (e.g. amaz)"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="search" inputmode="search" autofocus>
  </div>
  <!-- Ending soon (from the home screen's Ending shortcut): its one removable chip. Not the step 5 chip row. -->
  <div class="endbar" id="endbar" hidden>
    <button class="endchip" id="endchip" type="button">Ends within 7 days<span class="endx" aria-hidden="true">×</span><span class="sr-only">, remove filter</span></button>
  </div>
  <div class="use" id="use" aria-live="polite" hidden></div>
  <!-- What changed (a mode of this page): opened from an Offer freshness row with changes. -->
  <section class="wcpanel" id="wc" aria-label="What changed" hidden>
    <div class="wctop">
      <button class="wcback" id="wcback" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="wctitle"><div class="wcname" id="wcname"></div><div class="wcsub" id="wcsub"></div></div>
    </div>
    <div class="wctabs" id="wctabs" role="group" aria-label="New or gone"></div>
  </section>
  <!-- Quick Pick and Card Bonus details (a mode of this page): opened from a Quick picks tile or a Card bonuses row. -->
  <section class="dtpanel" id="dt" aria-labelledby="dt-h" hidden>
    <div class="dttop">
      <button class="wcback" id="dtback" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="wctitle"><h2 class="dth" id="dt-h"></h2><div class="wcsub" id="dtsub"></div></div>
    </div>
    <div class="dtbody" id="dtbody"></div>
  </section>
  <!-- Quick picks: the card to use for a type of purchase with no offer (home screen only). -->
  <section class="qp" id="qp" aria-labelledby="qp-h" hidden></section>
  <!-- Card bonuses: every live bonus entry and its status (home screen only). -->
  <section class="cb" id="cb" aria-labelledby="cb-h" hidden></section>
  <!-- New / Ending shortcuts (home screen only): What changed on New, and the list ending within 7 days. -->
  <section class="sc" id="sc" aria-label="Offer shortcuts" hidden>
    <button class="scgo" id="sc-new" type="button"><span class="scico scnewico" aria-hidden="true"><svg viewBox="0 0 20 20" fill="currentColor" focusable="false"><path d="M10 2.5c.4 3.6 1.9 5.1 5.5 5.5-3.6.4-5.1 1.9-5.5 5.5-.4-3.6-1.9-5.1-5.5-5.5 3.6-.4 5.1-1.9 5.5-5.5zM15.5 12.5c.2 1.6.9 2.3 2.5 2.5-1.6.2-2.3.9-2.5 2.5-.2-1.6-.9-2.3-2.5-2.5 1.6-.2 2.3-.9 2.5-2.5z"/></svg></span><span class="sctext"><span class="scn" id="sc-new-n"></span> <span class="scsub">from the latest reads</span></span></button>
    <button class="scgo" id="sc-end" type="button"><span class="scico scendico" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6l1.8 1.2"/></svg></span><span class="sctext"><span class="scn" id="sc-end-n"></span> <span class="scsub">in the next 7 days</span></span></button>
  </section>
  <!-- Home screen only: Offer freshness moves up here from the footer (placeHome in app.js). -->
  <div class="homefresh" id="homefresh" hidden></div>
  <!-- On phones the filters fold behind one button that summarises what is active; wide screens show them all. -->
  <button class="ftoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="filters"></button>
  <div class="filters" id="filters">
  <div class="filter">
    <label class="flabel" for="sort" id="sort-label">Sort</label>
    <div class="selwrap"><select id="sort" aria-describedby="sort-help"></select></div>
    <p class="sorthelp" id="sort-help"></p>
  </div>
  <div class="filter">
    <div class="flabel" id="chans-label">In store or online</div>
    <div class="cats" id="chans" role="group" aria-labelledby="chans-label"></div>
  </div>
  <div class="filter">
    <div class="flabel" id="acts-label">Activation</div>
    <div class="cats" id="acts" role="group" aria-labelledby="acts-label"></div>
    <p class="sorthelp" id="acts-note" hidden></p>
  </div>
  <!-- Signed in only: "Used (N)" lists the used offers. -->
  <div class="filter" id="used-filter" hidden>
    <div class="cats" id="used" role="group" aria-label="Used offers"></div>
  </div>
  <div class="filter">
    <div class="flabel" id="cards-label">Card</div>
    <div class="cards" id="cards" role="group" aria-labelledby="cards-label"></div>
  </div>
  <div class="filter">
    <div class="flabel" id="cats-label">Category</div>
    <div class="cats" id="cats" role="group" aria-labelledby="cats-label"></div>
  </div>
  <div class="filter cuis" id="cuis-filter" hidden>
    <div class="flabel" id="cuis-label">Cuisine</div>
    <div class="cuisines" id="cuis" role="group" aria-labelledby="cuis-label"></div>
  </div>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <p class="offline" id="offline" hidden></p>
  <main id="main"></main>
  <!-- Home screen only: the Filters button and panel move down here with the other utilities. They are the pre-step-5
       Filters, kept as they are until the step 5 filter sheet replaces them. -->
  <div class="homeutil" id="homeutil" hidden></div>
  <footer id="foot" hidden>
    <details class="fresh" id="fresh">
      <summary id="fsum"></summary>
      <div class="fbody">
        <p class="fnote">Age since the last full offer read, and what that read changed.</p>
        <ul class="flist" id="flist"></ul>
      </div>
    </details>
    <details class="fresh editmode" id="editmode">
      <summary id="editsum">Edit mode</summary>
      <div class="fbody" id="editbody">
        <!-- A username + password form so a password manager can fill it. Only the password is used. -->
        <form class="signin" id="signin" autocomplete="on">
          <label for="signin-user">Username</label>
          <input id="signin-user" name="username" autocomplete="username"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          <label for="signin-pass">Password</label>
          <input id="signin-pass" name="password" type="password" autocomplete="current-password" required>
          <button class="edbtn" type="submit">Sign in</button>
          <p class="ferr" id="signin-err" role="alert"></p>
        </form>
      </div>
    </details>
  </footer>
</div>
<div class="savebar" id="savebar" role="status" aria-live="polite" hidden>
  <div class="savein"><p class="savemsg" id="savemsg"></p><div class="savebtns" id="savebtns"></div></div>
</div>

<script src="js/edits.js"></script>
<script src="js/store.js"></script>
<script src="js/recent.js"></script>
<script src="js/copy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
